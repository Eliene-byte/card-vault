name: Build instaladores (Win + Linux + APK)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run sync:dist
      - run: npx electron-builder --win portable nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            !release/*.blockmap

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run sync:dist
      - run: npx electron-builder --linux AppImage deb --x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run sync:dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk card-vault-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: card-vault-debug.apk

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run sync:dist
      - run: cd dist && zip -r ../card-vault-pwa.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: card-vault-pwa.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, apk, pwa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
